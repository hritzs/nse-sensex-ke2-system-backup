<!-- FILE: ~/nse_fo_system/dashboard.html -->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NSE IV Screener Pro</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    background:#0b0f14;
    color:#e7edf6;
    font-family:Segoe UI,Arial,sans-serif;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 18px;
    border-bottom:1px solid #1a2430;
    background:#10151c;
}

.title{
    font-size:22px;
    font-weight:700;
    color:#00ff90;
}

.sub{
    font-size:12px;
    color:#8ea1b8;
    margin-top:4px;
}

.status{
    font-size:13px;
    color:#8ea1b8;
}

.wrap{
    padding:14px;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:10px;
    background:#111823;
}

thead{
    background:#17202c;
}

th,td{
    padding:10px 8px;
    text-align:right;
    border-bottom:1px solid #1a2430;
    font-size:13px;
}

th:first-child,
td:first-child{
    text-align:left;
}

tbody tr:hover{
    background:#151e29;
}

.up{ color:#00ff90; }
.down{ color:#ff5c73; }

.small{
    font-size:12px;
    color:#8ea1b8;
}

footer{
    padding:12px 18px;
    border-top:1px solid #1a2430;
    color:#7f92aa;
    font-size:12px;
}
</style>
</head>

<body>

<header>
<div>
<div class="title">NSE IV Screener Pro</div>
<div class="sub">Native C++ Feed · Live IV · Greeks</div>
</div>

<div class="status" id="status">Connecting...</div>
</header>

<div class="wrap">

<table>
<thead>
<tr>
<th>Symbol</th>
<th>LTP</th>
<th>IV %</th>
<th>Delta</th>
<th>Gamma</th>
<th>Theta</th>
<th>Vega</th>
<th>Underlying</th>
</tr>
</thead>

<tbody id="body"></tbody>
</table>

</div>

<footer>
Real-time options analytics powered by native C++ pricing engine.
</footer>

<script>
const tbody = document.getElementById("body");
const statusEl = document.getElementById("status");

const rows = {};
const latest = {};

function fmt(v,n=2){
    return Number(v).toFixed(n);
}

function ensureRow(symbol){

    if(rows[symbol]) return rows[symbol];

    const tr = document.createElement("tr");

    tr.innerHTML = `
        <td>${symbol}</td>
        <td class="ltp">-</td>
        <td class="iv">-</td>
        <td class="delta">-</td>
        <td class="gamma">-</td>
        <td class="theta">-</td>
        <td class="vega">-</td>
        <td class="under">-</td>
    `;

    tbody.appendChild(tr);
    rows[symbol] = tr;

    return tr;
}

function connect(){

    const host = location.hostname || "localhost";
    const ws = new WebSocket(`ws://${host}:9001`);

    ws.onopen = () => {
        statusEl.textContent = "Connected";
    };

    ws.onclose = () => {
        statusEl.textContent = "Disconnected · retrying...";
        setTimeout(connect,1500);
    };

    ws.onerror = () => {
        statusEl.textContent = "Socket Error";
    };

    ws.onmessage = (ev) => {

        let d;

        try{
            d = JSON.parse(ev.data);
        }catch(e){
            return;
        }

        if(!d.symbol || d.iv === undefined)
            return;

        latest[d.symbol] = d;
    };
}

connect();

function render(){

    const arr = Object.values(latest);

    arr.sort((a,b)=> b.iv - a.iv);

    tbody.innerHTML = "";

    for(const d of arr.slice(0,60)){

        const tr = ensureRow(d.symbol);

        const old =
            parseFloat(
                tr.querySelector(".ltp").textContent
            ) || 0;

        tr.querySelector("td").textContent = d.symbol;

        tr.querySelector(".ltp").textContent   = fmt(d.ltp);
        tr.querySelector(".iv").textContent    = fmt(d.iv,2);
        tr.querySelector(".delta").textContent = fmt(d.delta,4);
        tr.querySelector(".gamma").textContent = fmt(d.gamma,6);
        tr.querySelector(".theta").textContent = fmt(d.theta,4);
        tr.querySelector(".vega").textContent  = fmt(d.vega,4);
        tr.querySelector(".under").textContent = d.underlying || "-";

        const ltpCell = tr.querySelector(".ltp");

        if(d.ltp > old)
            ltpCell.className = "ltp up";
        else if(d.ltp < old)
            ltpCell.className = "ltp down";
        else
            ltpCell.className = "ltp";

        tbody.appendChild(tr);
    }

    requestAnimationFrame(render);
}

render();
</script>

</body>
</html>
