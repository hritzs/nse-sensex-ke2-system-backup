services:

  simulation-test:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: minute_simulation_test
    restart: "no"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      NIFTY_WS_URI: "ws://host.docker.internal:9001"
      MINUTE_HTTP_HOST: "0.0.0.0"
      MINUTE_HTTP_PORT: "8001"
      MINUTE_SIM_DB: "/app/data/minute_simulation_test.db"

    ports:
      - "8001:8001"

    volumes:
      - simulation_test_data:/app/data
      - simulation_test_logs:/app/logs

    profiles:
      - test

volumes:
  simulation_test_data:
  simulation_test_logs:
