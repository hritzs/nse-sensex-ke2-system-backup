services:

  simulation-prod:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: minute_simulation_prod
    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      NIFTY_WS_URI: "ws://host.docker.internal:9001"
      MINUTE_HTTP_HOST: "0.0.0.0"
      MINUTE_HTTP_PORT: "8000"
      MINUTE_SIM_DB: "/app/data/minute_simulation.db"

    ports:
      - "8000:8000"

    volumes:
      - ./docker-data/prod:/app/data
      - ./docker-data/prod-logs:/app/logs

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/runs', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  simulation-test:
    build:
      context: .
      dockerfile: Dockerfile.simulation
    container_name: minute_simulation_test
    restart: "no"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      NIFTY_WS_URI: "ws://host.docker.internal:9001"
      MINUTE_HTTP_HOST: "0.0.0.0"
      MINUTE_HTTP_PORT: "8001"
      MINUTE_SIM_DB: "/app/data/minute_simulation_test.db"

    ports:
      - "8001:8001"

    volumes:
      - ./docker-data/test:/app/data
      - ./docker-data/test-logs:/app/logs

    profiles:
      - test
